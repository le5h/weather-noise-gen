<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="35%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#2d1b69"/>
      <stop offset="85%" stop-color="#4a2c7d"/>
      <stop offset="100%" stop-color="#6b4c8a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a889a8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#8b6b9d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6b4c8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e4a6b"/>
      <stop offset="25%" stop-color="#1a3d5c"/>
      <stop offset="55%" stop-color="#122b44"/>
      <stop offset="100%" stop-color="#081829"/>
    </linearGradient>
    <linearGradient id="waveform" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e6b0"/>
      <stop offset="50%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#6b8e5a"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#6ba3c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1e4a6b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seabed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a2a" stop-opacity="0"/>
      <stop offset="40%" stop-color="#06101c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020810" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="baseGlow" cx="50%" cy="0%" r="60%" fx="50%" fy="0%">
      <stop offset="0%" stop-color="#87ceeb" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6ba3c7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1e4a6b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Horizon glow -->
  <rect x="0" y="260" width="512" height="80" fill="url(#glow)"/>

  <!-- Water -->
  <rect x="0" y="300" width="512" height="212" fill="url(#water)"/>

  <!-- Waveform base glow -->
  <rect x="0" y="300" width="512" height="120" fill="url(#baseGlow)"/>

  <!-- Horizon line -->
  <line x1="0" y1="300" x2="512" y2="300" stroke="rgba(168,137,168,0.6)" stroke-width="1.5"/>

  <!-- Waveform / mountain spectrum -->
  <path d="M0 300
    L16 300 L24 270 L32 250 L40 230 L48 218 L56 210 L64 206 L72 215 L80 230
    L88 248 L96 270 L104 284 L112 295 L120 300
    L128 300 L136 278 L144 248 L152 218 L160 195 L168 180 L176 172 L184 178 L192 195
    L200 218 L208 240 L216 258 L224 275 L232 290 L240 300
    L248 300 L256 282 L264 258 L272 232 L280 208 L288 190 L296 185 L304 190 L312 208
    L320 232 L328 258 L336 282 L344 300
    L352 300 L360 275 L368 242 L376 210 L384 185 L392 170 L400 165 L408 170 L416 185
    L424 210 L432 242 L440 275 L448 300 L464 300 L480 300 L512 300 Z"
    fill="url(#waveform)"/>

  <!-- Water reflection -->
  <path d="M0 300
    L16 300 L24 270 L32 250 L40 230 L48 218 L56 210 L64 206 L72 215 L80 230
    L88 248 L96 270 L104 284 L112 295 L120 300
    L128 300 L136 278 L144 248 L152 218 L160 195 L168 180 L176 172 L184 178 L192 195
    L200 218 L208 240 L216 258 L224 275 L232 290 L240 300
    L248 300 L256 282 L264 258 L272 232 L280 208 L288 190 L296 185 L304 190 L312 208
    L320 232 L328 258 L336 282 L344 300
    L352 300 L360 275 L368 242 L376 210 L384 185 L392 170 L400 165 L408 170 L416 185
    L424 210 L432 242 L440 275 L448 300 L464 300 L480 300 L512 300
    L512 480 L0 480 Z"
    fill="url(#reflection)"/>

  <!-- Seabed silhouette -->
  <path d="M0 460 Q40 440 80 450 Q130 435 180 445 Q240 430 300 448 Q360 438 420 450 Q470 440 512 455 L512 512 L0 512 Z" fill="url(#seabed)"/>

  <!-- Water surface ripples -->
  <g fill="none" stroke="rgba(168,200,220,0.12)" stroke-width="1.2" stroke-linecap="round">
    <path d="M40 308 Q60 305 80 308 Q100 311 120 308 Q140 305 160 308 Q180 311 200 308 Q220 305 240 308 Q260 311 280 308 Q300 305 320 308 Q340 311 360 308 Q380 305 400 308 Q420 311 440 308 Q460 305 480 308"/>
    <path d="M20 318 Q45 315 70 318 Q95 321 120 318 Q145 315 170 318 Q195 321 220 318 Q245 315 270 318 Q295 321 320 318 Q345 315 370 318 Q395 321 420 318 Q445 315 470 318 L490 318"/>
    <path d="M60 332 Q80 329 100 332 Q120 335 140 332 Q160 329 180 332 Q200 335 220 332 Q240 329 260 332 Q280 335 300 332 Q320 329 340 332 Q360 335 380 332 Q400 329 420 332 Q440 335 460 332"/>
  </g>

  <!-- Deeper wave lines -->
  <g fill="none" stroke="rgba(100,160,190,0.06)" stroke-width="1" stroke-linecap="round">
    <path d="M80 360 Q110 357 140 360 Q170 363 200 360 Q230 357 260 360 Q290 363 320 360 Q350 357 380 360 Q410 363 440 360"/>
    <path d="M50 390 Q85 387 120 390 Q155 393 190 390 Q225 387 260 390 Q295 393 330 390 Q365 387 400 390 Q435 393 470 390"/>
  </g>

  <!-- Lightning water reflections -->
  <g stroke="rgba(255,255,255,0.08)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M150 320 L158 360 L146 360 L160 400" stroke-width="1.5"/>
    <path d="M374 320 L382 350 L370 350 L380 380" stroke-width="1.2"/>
  </g>

  <!-- Underwater light shafts -->
  <g fill="none" stroke="rgba(135,206,235,0.04)" stroke-linecap="round">
    <line x1="176" y1="300" x2="160" y2="440" stroke-width="8"/>
    <line x1="296" y1="300" x2="285" y2="420" stroke-width="6"/>
    <line x1="400" y1="300" x2="410" y2="440" stroke-width="7"/>
  </g>

  <!-- Foam / surface shimmer dots -->
  <g fill="#fff" opacity="0.08">
    <circle cx="60" cy="304" r="1.2"/>
    <circle cx="140" cy="306" r="1"/>
    <circle cx="220" cy="303" r="1.3"/>
    <circle cx="300" cy="307" r="1"/>
    <circle cx="380" cy="304" r="1.2"/>
    <circle cx="450" cy="305" r="1"/>
    <circle cx="100" cy="310" r="0.8"/>
    <circle cx="260" cy="312" r="0.8"/>
    <circle cx="420" cy="309" r="0.9"/>
  </g>

  <!-- Underwater drift particles -->
  <g fill="rgba(135,206,235,0.06)">
    <circle cx="90" cy="370" r="1.5"/>
    <circle cx="200" cy="400" r="1.2"/>
    <circle cx="330" cy="380" r="1.3"/>
    <circle cx="430" cy="420" r="1"/>
    <circle cx="150" cy="430" r="1.2"/>
    <circle cx="280" cy="440" r="0.8"/>
    <circle cx="380" cy="390" r="1.1"/>
    <circle cx="50" cy="410" r="0.9"/>
    <circle cx="480" cy="370" r="1"/>
  </g>

  <!-- Lightning bolt -->
  <g filter="url(#glowFilter)">
    <path d="M160 60 L148 120 L170 120 L150 180" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <path d="M380 80 L368 130 L390 130 L374 180" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  </g>

  <!-- Sound waves -->
  <g fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2.5" stroke-linecap="round">
    <path d="M76 72 q16 14 0 28"/>
    <path d="M76 56 q28 24 0 48"/>
    <path d="M76 40 q40 34 0 68"/>
    <path d="M436 68 q-16 14 0 28"/>
    <path d="M436 52 q-28 24 0 48"/>
  </g>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="72" cy="36" r="2.5" opacity=".35"/>
    <circle cx="95" cy="52" r="1.5" opacity=".25"/>
    <circle cx="130" cy="30" r="2" opacity=".3"/>
    <circle cx="210" cy="45" r="1.5" opacity=".2"/>
    <circle cx="280" cy="28" r="2.5" opacity=".35"/>
    <circle cx="320" cy="55" r="1.5" opacity=".2"/>
    <circle cx="360" cy="35" r="2" opacity=".3"/>
    <circle cx="430" cy="42" r="1.5" opacity=".25"/>
    <circle cx="460" cy="55" r="2" opacity=".2"/>
    <circle cx="180" cy="70" r="1.5" opacity=".15"/>
    <circle cx="250" cy="65" r="1.8" opacity=".2"/>
    <circle cx="395" cy="50" r="1.5" opacity=".18"/>
  </g>

  <!-- Rain streaks -->
  <g stroke="#fff" stroke-linecap="round" opacity=".12">
    <line x1="50" y1="110" x2="45" y2="128" stroke-width="1.2"/>
    <line x1="120" y1="95" x2="115" y2="113" stroke-width="1"/>
    <line x1="190" y1="100" x2="185" y2="118" stroke-width="1.2"/>
    <line x1="260" y1="90" x2="255" y2="108" stroke-width="1"/>
    <line x1="330" y1="105" x2="325" y2="123" stroke-width="1.2"/>
    <line x1="400" y1="85" x2="395" y2="103" stroke-width="1"/>
    <line x1="450" y1="100" x2="445" y2="118" stroke-width="1"/>
  </g>

  <!-- Floating air particles -->
  <g fill="#fff" opacity=".08">
    <circle cx="100" cy="170" r="1.5"/>
    <circle cx="155" cy="145" r="1.2"/>
    <circle cx="230" cy="155" r="1.3"/>
    <circle cx="310" cy="165" r="1.2"/>
    <circle cx="380" cy="140" r="1.5"/>
    <circle cx="440" cy="160" r="1.2"/>
  </g>
</svg>
