<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes - Enhanced</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="snowflakes"></canvas>
    
    <div class="info">Weather: <span id="weather-display" style="color: #fff;">Heavy Snow</span></div>
    
    <div class="controls">
        <button class="control-btn" data-mode="normal" title="Normal Mode">☀️ Sunny</button>
        <button class="control-btn active" data-mode="heavy" title="Heavy Snow">❄️ Heavy Snow</button>
        <button class="control-btn" data-mode="windy" title="Windy">💨 Windy</button>
        <button class="control-btn" data-mode="rain" title="Rain">🌧️ Rain</button>
    </div>

    <!-- Audio elements for wind and rain noise -->
    <audio id="wind-audio" loop></audio>
    <audio id="rain-audio" loop></audio>

    <script src="js/main.js"></script>
</body>
</html>
