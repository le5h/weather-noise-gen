<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes - Debug</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="snowflakes-canvas"></canvas>

    <script>
        const canvas = document.getElementById('snowflakes-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // Set canvas to full viewport size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Handle high-DPI displays - set actual pixel dimensions without scaling context
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.style.width = canvas.clientWidth + 'px';
            canvas.style.height = canvas.clientHeight + 'px';
        }

        // Get snowflake count
        function getSnowflakeCount() {
            return 50;
        }

        // Snowflake class with lifecycle management
        class Snowflake {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = Math.random() * 1 + 0.5;
            }

            draw() {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Bounce off bottom edge
                if (this.y > canvas.height) {
                    this.y = -10;
                    this.speedY = Math.random() * 1 + 0.5;
                }

                // Keep within bounds
                this.x = Math.max(0, Math.min(canvas.width, this.x));
                
                return true;
            }
        }

        // Create initial snowflakes
        const snowflakes = [];
        function initSnowflakes(count) {
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = -10;
                snowflakes.push(new Snowflake(x, y));
            }
        }

        // Animation loop
        function animate(timestamp) {
            if (!timestamp) timestamp = performance.now();
            
            // Clear the canvas first
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw snowflakes
            for (const flake of snowflakes) {
                const shouldKeep = flake.update();
                if (shouldKeep) {
                    flake.draw();
                } else {
                    const index = snowflakes.indexOf(flake);
                    if (index > -1) {
                        snowflakes.splice(index, 1);
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // Initialize and start animation
        window.onload = () => {
            resizeCanvas();
            initSnowflakes(getSnowflakeCount());
            animate();
            
            console.log(`Initialized ${snowflakes.length} snowflakes`);
        };

        // Handle window resizing
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
