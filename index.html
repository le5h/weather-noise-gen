<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; overflow: hidden; min-height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="snowflakes"></canvas>
    <script>
        const canvas = document.getElementById('snowflakes');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        let count = parseInt(localStorage.getItem('snowflake-count')) || 100;
        const flakes = [];

        class Flake {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() + 1;
                this.size = Math.random() * 3 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.y > canvas.height) {
                    this.y = -Math.random() * 50;
                    this.size = Math.random() * 3 + 1;
                }

                return true;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            resize();
            for (let i = 0; i < count; i++) {
                flakes.push(new Flake());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (const flake of flakes) {
                flake.update();
                flake.draw();
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            resize();
            localStorage.setItem('snowflake-count', count.toString());
        });

        init();
        animate();
    </script>
</body>
</html>
