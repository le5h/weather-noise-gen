<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Snowflakes - Enhanced</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            overflow: hidden; 
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        canvas { display: block; width: 100%; height: 100%; }
        
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 12px 24px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .control-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-2px);
        }
        
        .control-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        
        .info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="snowflakes"></canvas>
    
    <div class="info">Snowflake Count: <span id="count-display">100</span></div>
    
    <div class="controls">
        <button class="control-btn" data-mode="normal" title="Normal Mode">🌧️ Normal</button>
        <button class="control-btn active" data-mode="heavy" title="Heavy Snow">❄️ Heavy</button>
        <button class="control-btn" data-mode="windy" title="Windy">💨 Windy</button>
        <button class="control-btn" data-mode="rain" title="Rain">🌧️ Rain</button>
    </div>

    <script>
        const canvas = document.getElementById('snowflakes');
        const ctx = canvas.getContext('2d');
        const countDisplay = document.getElementById('count-display');
        
        let width, height;
        let flakes = [];
        let mode = 'heavy'; // normal, heavy, windy, rain
        
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        class Flake {
            constructor(isRain = false) {
                this.isRain = isRain;
                
                if (isRain) {
                    // Rain properties
                    this.x = Math.random() * width;
                    this.y = Math.random() * -height;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 15 + 15;
                    this.size = Math.random() * 3 + 1;
                } else {
                    // Snow properties
                    this.x = Math.random() * width;
                    this.y = Math.random() * -height;
                    this.vx = (Math.random() - 0.5) * 2;
                    this.vy = Math.random() * 3 + 1;
                    this.size = Math.random() * 4 + 1;
                }
                
                // Add some randomness to rotation and sway
                this.swaySpeed = (Math.random() - 0.5) * 0.2;
                this.swayAngle = Math.random() * Math.PI * 2;
            }

            update() {
                if (mode === 'windy') {
                    // Wind mode: stronger horizontal movement
                    this.x += this.vx + (Math.random() - 0.5) * 3;
                    this.y += this.vy;
                    
                    // Add sway effect
                    this.swayAngle += this.swaySpeed;
                } else if (mode === 'rain') {
                    // Rain mode: straight down with slight horizontal drift
                    this.x += this.vx;
                    this.y += this.vy;
                } else {
                    // Normal and Heavy modes
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Add sway effect for normal snow
                    if (mode === 'normal') {
                        this.swayAngle += this.swaySpeed;
                        this.x += Math.sin(this.swayAngle) * 0.5;
                    }
                }

                // Reset when out of bounds
                if (this.y > height + 100) {
                    this.y = -Math.random() * 200 - 50;
                    
                    if (!this.isRain) {
                        this.size = Math.random() * 4 + 1;
                    } else {
                        // Rain stays consistent size
                        this.size = Math.random() * 3 + 1;
                    }
                }

                return true;
            }

            draw() {
                ctx.beginPath();
                
                if (this.isRain) {
                    // Draw rain as lines
                    const length = this.vy / 20;
                    ctx.strokeStyle = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.3})`;
                    ctx.lineWidth = Math.max(1, this.size);
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x, this.y + length);
                    ctx.stroke();
                } else {
                    // Draw snowflakes as circles with glow effect
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.size / 2
                    );
                    
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                    gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function init(count = 100) {
            resize();
            flakes = [];
            
            for (let i = 0; i < count; i++) {
                flakes.push(new Flake(mode === 'rain'));
            }
            
            countDisplay.textContent = count;
        }

        function animate() {
            // Create trail effect by drawing semi-transparent rectangle instead of clearing completely
            ctx.fillStyle = mode === 'rain' ? 'rgba(0, 0, 0, 0.1)' : 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);
            
            for (const flake of flakes) {
                flake.update();
                flake.draw();
            }

            requestAnimationFrame(animate);
        }

        // Control buttons functionality
        const controlBtns = document.querySelectorAll('.control-btn');
        
        controlBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                mode = btn.dataset.mode;
                
                // Update active state
                controlBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                // Reset flakes when changing modes
                init();
            });
        });

        window.addEventListener('resize', () => {
            resize();
        });

        // Initialize and start animation
        init();
        animate();
    </script>
</body>
</html>
